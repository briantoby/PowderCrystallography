<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>$if(title-prefix)$$title-prefix$ – $endif$$pagetitle$</title>
  <style>
    :root {
      --fg: #1f2328;
      --muted: #59636e;
      --bg: #ffffff;
      --card: #f6f8fa;
      --link: #0969da;
      --border: #d0d7de;
      --btn-fg: #ffffff;
      --btn-bg: #1f883d;
      --btn-bg-hover: #1a7f37;
      --maxw: 920px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --muted: #9da7b3;
        --bg: #0d1117;
        --card: #161b22;
        --link: #58a6ff;
        --border: #30363d;
        --btn-fg: #ffffff;
        --btn-bg: #238636;
        --btn-bg-hover: #2ea043;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height: 1.65;
    }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 1.2rem 3rem;
    }

    header.site {
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.2rem;
      background: var(--bg);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 0;
    }
    .brand {
      font-weight: 600;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      align-items: center;
    }
    .links a {
      color: var(--link);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .links a:hover { text-decoration: underline; }

    .hero {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      padding: 1rem 1rem 1.1rem;
      margin: 1rem 0 1.4rem;
    }
    .hero p {
      margin: 0.35rem 0 0.8rem;
      color: var(--muted);
    }

    .btn {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--btn-fg) !important;
      text-decoration: none;
      border-radius: 8px;
      padding: 0.62rem 0.9rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .btn:hover {
      background: var(--btn-bg-hover);
      text-decoration: none !important;
    }

    main h1, main h2, main h3 { line-height: 1.25; }
    main h2 { margin-top: 0.2rem; font-size: 1.6rem; }
    main p { margin: 0.9rem 0; }
    main a { color: var(--link); }
    main hr { border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap nav">
      <div class="brand">Powder Crystallography with GSAS-II</div>
      <nav class="links" aria-label="Main navigation">
        <a href="https://github.com/briantoby/PowderCrystallography">Repository</a>
        <a href="https://github.com/briantoby/PowderCrystallography/releases/latest">Releases</a>
        <a href="https://github.com/briantoby/PowderCrystallography/issues">Issues</a>
        <a href="https://github.com/briantoby/PowderCrystallography/discussions">Discussions</a>
        <a href="HTML-template.html">HTML text</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <section class="hero" aria-label="Quick access">
      <strong>Download the book</strong>
      <p>Get the newest PDF from the latest GitHub release.</p>
      <a class="btn" href="https://github.com/briantoby/PowderCrystallography/releases/latest">
        Latest PDF Release
      </a>
    </section>

    <main>
      $body$
    </main>

    <footer>
      Generated from <code>web/index.md</code> with Pandoc in GitHub Actions.
    </footer>
  </div>
</body>
</html>
