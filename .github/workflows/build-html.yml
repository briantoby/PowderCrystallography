name: Build HTML from LaTeX (with make4ht)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-html:
    runs-on: ubuntu-24.04
    container:
      image: texlive/texlive:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          apt-get update
          apt-get install -y pandoc

      - name: Verify toolchain
        run: |
          which make4ht
          make4ht --version
          pandoc --version

      - name: Build HTML with make4ht
        run: |
          mkdir -p _html
          make4ht -u -f html5 -d _html HTML-template.tex "mathjax,fn-in,xhtml,3"

      - name: Create root index.html from web/index.md
        run: |
          pandoc web/index.md \
            -f gfm \
            -t html5 \
            --standalone \
            --template=web/index-template.html \
            --metadata title="Powder Crystallography with GSAS-II" \
            --metadata title-prefix="Crystallographic Powder Diffraction Analysis" \
            -o _html/index.html

      # Debug steps: uncomment these if the Pages deploy fails again.
      # - name: Inspect HTML output
      #   run: |
      #     pwd
      #     ls -la
      #     echo
      #     ls -la _html
      #     echo
      #     find _html -maxdepth 2 -type f | sort
      #
      # - name: Fail if index.html is missing
      #   run: |
      #     test -f _html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _html

  deploy-pages:
    needs: build-html
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
